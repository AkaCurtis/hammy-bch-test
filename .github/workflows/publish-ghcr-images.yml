name: Publish GHCR Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, for example 0.3.0"
        required: true
        default: "0.3.0"
      git_ref:
        description: "Git ref to build from"
        required: true
        default: "main"
      bchn_ref:
        description: "Bitcoin Cash Node ref to build"
        required: true
        default: "v28.0.0"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: akacurtis

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      git_ref: ${{ steps.vars.outputs.git_ref }}
      bchn_ref: ${{ steps.vars.outputs.bchn_ref }}
    steps:
      - id: vars
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "git_ref=${{ github.event.inputs.git_ref }}" >> "$GITHUB_OUTPUT"
            echo "bchn_ref=${{ github.event.inputs.bchn_ref }}" >> "$GITHUB_OUTPUT"
          else
            version="${GITHUB_REF_NAME#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "git_ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "bchn_ref=v28.0.0" >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: hammy-bch-solo-node-bchn
            context: ./hammy-bch-solo-node/services/bchn
            build_args: |
              BCHN_REF=${{ needs.prepare.outputs.bchn_ref }}
          - image_name: hammy-bch-solo-node-ckpool
            context: ./hammy-bch-solo-node/services/ckpool
            build_args: ""
          - image_name: hammy-bch-solo-node-web
            context: ./hammy-bch-solo-node/web
            build_args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
